" dominant-baseline="central" font-weight="normal">本人の左は画像の右に写る</text><rect x="450" y="160" width="230" height="60" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="565.0" y="181.0" font-size="13" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">鏡に映した見え方</text><text x="565.0" y="200.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">本人の左は左に見える</text><text x="565" y="250" font-size="12" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="normal">θ は本人から見た向きで決める</text>
