<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" style="font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1f2328"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0b6aa8"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0f6e56"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#854f0b"/></marker></defs>
<rect x="10" y="10" width="380" height="300" rx="10" fill="#dbeaf6" stroke="#0b6aa8"/><text x="25" y="30" font-size="13" fill="#0b6aa8" text-anchor="start" dominant-baseline="central" font-weight="bold">コンテナ</text><rect x="22" y="50" width="86" height="40" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="65.0" y="70.0" font-size="10.5" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">rosbridge</text><line x1="65" y1="90" x2="135" y2="188" stroke="#0b6aa8" stroke-width="1.2"/><rect x="114" y="50" width="86" height="40" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="157.0" y="70.0" font-size="10.5" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">finger_detect</text><rect x="206" y="50" width="86" height="40" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="249.0" y="70.0" font-size="10.5" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">finger_dance</text><line x1="249" y1="90" x2="215" y2="188" stroke="#0b6aa8" stroke-width="1.2"/><rect x="298" y="50" width="86" height="40" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="341.0" y="70.0" font-size="10.5" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">rqt_image_view</text><line x1="157" y1="92" x2="175" y2="186" stroke="#854f0b" stroke-width="3" marker-end="url(#aa)"/><line x1="215" y1="188" x2="341" y2="94" stroke="#854f0b" stroke-width="3" marker-end="url(#aa)"/><rect x="90" y="190" width="210" height="60" rx="6" fill="#fff" stroke="#0b6aa8" stroke-width="1"/><text x="195.0" y="211.0" font-size="13" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">Zenoh ルータ</text><text x="195.0" y="230.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ノードはここにだけつながる</text><text x="278" y="168" font-size="11" fill="#854f0b" text-anchor="start" dominant-baseline="central" font-weight="bold">検出画面の画像</text><text x="278" y="184" font-size="11" fill="#854f0b" text-anchor="start" dominant-baseline="central" font-weight="normal">約 9 MB/秒</text><text x="200" y="272" font-size="11" fill="#854f0b" text-anchor="middle" dominant-baseline="central" font-weight="normal">検出画面の画像は finger_detect から rqt_image_view へ</text><text x="200" y="290" font-size="11" fill="#854f0b" text-anchor="middle" dominant-baseline="central" font-weight="normal">コンテナの中だけで渡し、ロボットへは送らない</text><rect x="530" y="10" width="180" height="300" rx="10" fill="#d9f2ea" stroke="#0f6e56"/><text x="545" y="30" font-size="13" fill="#0f6e56" text-anchor="start" dominant-baseline="central" font-weight="bold">ロボット</text><rect x="545" y="50" width="150" height="40" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="620.0" y="70.0" font-size="12" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">raspimouse</text><line x1="620" y1="90" x2="620" y2="188" stroke="#0f6e56" stroke-width="1.2"/><rect x="545" y="190" width="150" height="60" rx="6" fill="#fff" stroke="#0f6e56" stroke-width="1"/><text x="620.0" y="211.0" font-size="13" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="bold">Zenoh ルータ</text><text x="620.0" y="230.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">TCP 7447 で待つ</text><line x1="300" y1="220" x2="543" y2="220" stroke="#0f6e56" stroke-width="2.2" marker-end="url(#at)"/><text x="460" y="158" font-size="11" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="normal">① コンテナから</text><text x="460" y="174" font-size="11" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="normal">つなぎに行く</text><text x="460" y="205" font-size="9.5" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">tcp/&lt;ロボットのIP&gt;:7447</text><text x="460" y="246" font-size="11" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="normal">② ロボットへ送るのは</text><text x="460" y="262" font-size="11" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="normal">速度の指令などだけ</text>
</svg>
