8765" y="432.8703971205149" font-size="10" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">−170°</text><circle cx="250" cy="230" r="34" fill="#fff" stroke="#8c959f"/><text x="250" y="230" font-size="10" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">付け根</text><text x="480" y="120" font-size="13" fill="#1f2328" text-anchor="start" dominant-baseline="central" font-weight="normal">前後の速さ  v = 0.05 × cos θ  [m/s]</text><text x="480" y="150" font-size="13" fill="#1f2328" text-anchor="start" dominant-baseline="central" font-weight="normal">旋回の速さ  ω = 1.0 × sin θ  [rad/s]</text><text x="480" y="190" font-size="12" fill="#57606a" text-anchor="start" dominant-baseline="central" font-weight="normal">真上・真下から ±10° 以内 → ω = 0</text><text x="480" y="214" font-size="12" fill="#57606a" text-anchor="start" dominant-baseline="central" font-weight="normal">真横から ±20° 以内 → v = 0</text><text x="480" y="254" font-size="12" fill="#57606a" text-anchor="start" dominant-baseline="central" font-weight="normal">θ の + は本人から見て左</text><text x="480" y="278" font-size="12" fill="#57606a" text-anchor="start" dominant-baseline="central" font-weight="normal">ω の + は左回り（反時計回り）</text>
