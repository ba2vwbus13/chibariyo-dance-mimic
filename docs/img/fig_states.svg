<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" style="font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1f2328"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0b6aa8"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0f6e56"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#854f0b"/></marker></defs>
<rect x="250" y="20" width="180" height="60" rx="6" fill="#fae6df" stroke="#993c1d" stroke-width="1"/><text x="340.0" y="41.0" font-size="13" fill="#993c1d" text-anchor="middle" dominant-baseline="central" font-weight="bold">停止</text><text x="340.0" y="60.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">v = 0、ω = 0</text><rect x="40" y="210" width="200" height="60" rx="6" fill="#dbeaf6" stroke="#0b6aa8" stroke-width="1"/><text x="140.0" y="231.0" font-size="13" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">走る</text><text x="140.0" y="250.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">指の向きで v・ω</text><rect x="440" y="210" width="200" height="60" rx="6" fill="#d9f2ea" stroke="#0f6e56" stroke-width="1"/><text x="540.0" y="231.0" font-size="13" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="bold">踊る</text><text x="540.0" y="250.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">左右に小刻みに振る</text><path d="M260 80 L150 208" fill="none" stroke="#0b6aa8" stroke-width="1.4" marker-end="url(#ab)"/><text x="118" y="130" font-size="11" fill="#0b6aa8" text-anchor="start" dominant-baseline="central" font-weight="normal">人差し指を</text><text x="118" y="146" font-size="11" fill="#0b6aa8" text-anchor="start" dominant-baseline="central" font-weight="normal">2 回続けて検出</text><path d="M420 80 L530 208" fill="none" stroke="#0f6e56" stroke-width="1.4" marker-end="url(#at)"/><text x="500" y="130" font-size="11" fill="#0f6e56" text-anchor="start" dominant-baseline="central" font-weight="normal">チョキを</text><text x="500" y="146" font-size="11" fill="#0f6e56" text-anchor="start" dominant-baseline="central" font-weight="normal">2 回続けて検出</text><path d="M190 208 L300 82" fill="none" stroke="#993c1d" stroke-width="1.4" marker-end="url(#a)"/><path d="M490 208 L380 82" fill="none" stroke="#993c1d" stroke-width="1.4" marker-end="url(#a)"/><text x="340" y="140" font-size="11" fill="#993c1d" text-anchor="middle" dominant-baseline="central" font-weight="normal">グー・パー・その他・手なし</text><text x="340" y="156" font-size="11" fill="#993c1d" text-anchor="middle" dominant-baseline="central" font-weight="normal">→ すぐに停止</text><text x="340" y="184" font-size="11" fill="#993c1d" text-anchor="middle" dominant-baseline="central" font-weight="normal">検出結果が 0.5 秒届かない → 停止</text><path d="M240 250 L438 250" fill="none" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/><text x="340" y="236" font-size="10" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">チョキを 2 回</text><text x="340" y="266" font-size="10" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">人差し指を 2 回</text><path d="M438 258 L242 258" fill="none" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
</svg>
