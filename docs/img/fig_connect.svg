<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" style="font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1f2328"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0b6aa8"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0f6e56"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#854f0b"/></marker></defs>
<text x="350" y="18" font-size="13" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">robot_connect &lt;ロボットのIP&gt; を実行すると</text><rect x="10" y="36" width="158" height="78" rx="6" fill="#dbeaf6" stroke="#0b6aa8"/><text x="89.0" y="54" font-size="14" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">1</text><text x="89.0" y="76" font-size="12" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">つなぎ先を保存</text><text x="89.0" y="98" font-size="9.5" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ファイル ~/.robot_ip に書く</text><line x1="168" y1="75" x2="181" y2="75" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/><rect x="182" y="36" width="158" height="78" rx="6" fill="#dbeaf6" stroke="#0b6aa8"/><text x="261.0" y="54" font-size="14" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">2</text><text x="261.0" y="76" font-size="12" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">Zenoh ルータを起動</text><text x="261.0" y="98" font-size="9.5" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ロボットの 7447 番につなぐ</text><line x1="340" y1="75" x2="353" y2="75" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/><rect x="354" y="36" width="158" height="78" rx="6" fill="#dbeaf6" stroke="#0b6aa8"/><text x="433.0" y="54" font-size="14" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">3</text><text x="433.0" y="76" font-size="12" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">通信方式を切り替え</text><text x="433.0" y="98" font-size="9.5" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ノードが rmw_zenoh を使う</text><line x1="512" y1="75" x2="525" y2="75" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/><rect x="526" y="36" width="158" height="78" rx="6" fill="#dbeaf6" stroke="#0b6aa8"/><text x="605.0" y="54" font-size="14" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">4</text><text x="605.0" y="76" font-size="12" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">新しい端末にも反映</text><text x="605.0" y="98" font-size="9.5" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">開くたびに 1 を読んで 3 を行う</text><text x="350" y="150" font-size="13" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">ROS_DOMAIN_ID が同じノードどうしだけが通信する</text><rect x="60" y="170" width="170" height="50" rx="6" fill="#dbeaf6" stroke="#0b6aa8" stroke-width="1"/><text x="145.0" y="186.0" font-size="12" fill="#0b6aa8" text-anchor="middle" dominant-baseline="central" font-weight="bold">finger_dance</text><text x="145.0" y="205.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ROS_DOMAIN_ID 30</text><rect x="470" y="170" width="170" height="50" rx="6" fill="#d9f2ea" stroke="#0f6e56" stroke-width="1"/><text x="555.0" y="186.0" font-size="12" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="bold">raspimouse</text><text x="555.0" y="205.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ROS_DOMAIN_ID 30</text><line x1="230" y1="195" x2="468" y2="195" stroke="#0f6e56" stroke-width="2" marker-end="url(#at)"/><text x="349" y="183" font-size="11" fill="#0f6e56" text-anchor="middle" dominant-baseline="central" font-weight="normal">/cmd_vel が届く</text><rect x="60" y="240" width="170" height="50" rx="6" fill="#fff" stroke="#8c959f" stroke-width="1"/><text x="145.0" y="256.0" font-size="12" fill="#1f2328" text-anchor="middle" dominant-baseline="central" font-weight="bold">ほかのノード</text><text x="145.0" y="275.0" font-size="11" fill="#57606a" text-anchor="middle" dominant-baseline="central" font-weight="normal">ROS_DOMAIN_ID 0</text><line x1="230" y1="265" x2="440" y2="265" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4"/><line x1="440" y1="255" x2="456" y2="275" stroke="#993c1d" stroke-width="3"/><line x1="456" y1="255" x2="440" y2="275" stroke="#993c1d" stroke-width="3"/><text x="335" y="253" font-size="11" fill="#993c1d" text-anchor="middle" dominant-baseline="central" font-weight="normal">番号が違うので届かない</text>
</svg>
